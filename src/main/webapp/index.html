<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Curve Generator</title>
    <style> body { font-family: Arial; text-align: center; } </style>
</head>
<body>
    <h1>🧮 Fibonacci Curve Generator</h1>
    <p>Enter number of terms (N, 1-100, default 6):</p>
    <input type="number" id="n" value="6" min="1" max="100">
    <button onclick="drawCurve()">Generate Curve</button>
    <br><br>
    <img id="curve" src="CurveServlet?n=6" alt="Fibonacci Curve" style="border: 1px solid #ccc; max-width: 100%;">
    <script>
        function drawCurve() {
            var n = document.getElementById('n').value;
            document.getElementById('curve').src = 'CurveServlet?n=' + n + '&t=' + new Date().getTime();  // Cache bust
        }
    </script>
</body>
</html>
