<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>SS AI Lab - Fibonacci Curve</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden}
.header{background:linear-gradient(135deg,#4682B4 0%,#1E3A5F 100%);color:#fff;padding:30px;text-align:center}
.header h1{font-size:2.5em;margin-bottom:10px}
.main-content{display:grid;grid-template-columns:1fr 2fr;gap:30px;padding:30px}
.controls{background:#f8f9fa;padding:25px;border-radius:15px}
.controls h2{color:#4682B4;margin-bottom:20px}
.form-group{margin-bottom:20px}
label{display:block;margin-bottom:8px;color:#333;font-weight:600}
input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:1em}
button{width:100%;padding:15px;background:linear-gradient(135deg,#4682B4 0%,#1E3A5F 100%);color:#fff;border:none;border-radius:8px;font-size:1.1em;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(70,130,180,0.4)}
.result{margin-top:20px;padding:15px;background:#d4edda;border:2px solid #28a745;border-radius:8px;color:#155724;font-weight:bold;display:none}
.result.error{background:#f8d7da;border-color:#dc3545;color:#721c24}
.display{background:#fff;padding:25px;border-radius:15px}
.display h2{color:#4682B4;margin-bottom:20px;text-align:center}
#output-container{width:100%;min-height:600px;border:2px solid #ddd;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:auto}
#output-container img,#output-container svg{max-width:100%;max-height:100%;object-fit:contain}
.placeholder{color:#999;font-style:italic;text-align:center;padding:40px}
.info-box{background:#e7f3ff;border-left:4px solid #4682B4;padding:15px;margin-top:20px;border-radius:5px;font-size:0.9em;color:#0066cc}
code{background:#f5f5f5;padding:2px 6px;border-radius:3px;font-family:monospace}
@media(max-width:968px){.main-content{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class='container'>
<div class='header'>
<h1> SS AI Lab</h1>
<p>Fibonacci Curve - Java Output Display</p>
</div>
<div class='main-content'>
<div class='controls'>
<h2> Controls</h2>
<div class='form-group'>
<label for='operation'>Operation:</label>
<select id='operation' onchange='updateFields()'>
<option value='add'>Addition</option>
<option value='sub'>Subtraction</option>
<option value='mul'>Multiplication</option>
<option value='div'>Division</option>
<option value='fib'>Fibonacci Curve</option>
</select>
</div>
<div id='inputs'></div>
<div id='curve-length' style='display:none;margin:15px 0;padding:12px;background:#e7f3ff;border-left:4px solid #4682B4;border-radius:5px;font-weight:bold;color:#0066cc;font-size:1.1em;text-align:center'></div>
<button onclick='calc()'>Calculate</button>
<div id='result' class='result'></div>
</div>
<div class='display'>
<h2>Output</h2>
<div id='output-container'>
<div id='placeholder' class='placeholder'>Select operation and Calculate<br><strong>Fibonacci:</strong> Loads Java-generated PNG/SVG</div>
</div>
</div>
</div>
</div>
<script>
updateFields();
function updateFields(){
const op=document.getElementById('operation').value;
const inp=document.getElementById('inputs');
if(op==='fib'){
inp.innerHTML='<div class=form-group><label for=n>Number of terms (N):</label><input type=number id=n value=10 min=1 max=30></div><p style=font-size:0.85em;color:#666>Enter N and click Calculate - Java will auto-generate the curve</p>';
}else{
inp.innerHTML='<div class=form-group><label for=a>Value A:</label><input type=number id=a value=0 step=0.01></div><div class=form-group><label for=b>Value B:</label><input type=number id=b value=0 step=0.01></div>';
}
document.getElementById('result').style.display='none';
clear();
}
function calc(){
const op=document.getElementById('operation').value;
if(op==='fib'){
const n=parseInt(document.getElementById('n').value);
if(n<1||n>30){showRes('N must be 1-30',1);return;}
loadPlot(n);
showRes('Loading plot N='+n,0);
}else{
const a=parseFloat(document.getElementById('a').value);
const b=parseFloat(document.getElementById('b').value);
let r;
if(op==='add')r=a+b;
else if(op==='sub')r=a-b;
else if(op==='mul')r=a*b;
else if(op==='div'){
if(b===0){showRes('Cannot divide by zero',1);return;}
r=a/b;
}
showRes('Result: '+r.toFixed(2),0);
clear();
}
}
function showRes(m,e){
const d=document.getElementById('result');
d.textContent=m;
d.className='result'+(e?' error':'');
d.style.display='block';
}
function loadPlot(n){
const c=document.getElementById('output-container');
const p=document.getElementById('placeholder');
const lengthDiv=document.getElementById('curve-length');
if(p)p.style.display='none';
lengthDiv.style.display='none';
showRes('Generating curve for N='+n+'...',0);
fetch('/generate?n='+n,{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('Generation failed');return r.json();})
.then(data=>{
c.innerHTML=data.svg;
lengthDiv.textContent='Total Fibonacci Curve Length: '+data.totalLength.toFixed(2)+' units';
lengthDiv.style.display='block';
showRes('✓ Curve generated for N='+n,0);
})
.catch(e=>{showRes('Error: '+e.message+'. Make sure Java files are compiled.',1);if(p)p.style.display='block';});
}
function clear(){
const c=document.getElementById('output-container');
const lengthDiv=document.getElementById('curve-length');
c.innerHTML='<div id="placeholder" class="placeholder">Select operation and Calculate<br><strong>Fibonacci:</strong> Loads Java-generated PNG/SVG</div>';
lengthDiv.style.display='none';
}
</script>
</body>
</html>
